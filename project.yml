name: L16Studio
options:
  bundleIdPrefix: dev.sunkencity
  deploymentTarget:
    macOS: "14.0"

packages:
  LRIKit:
    path: ./LRIKit

targets:
  L16Studio:
    type: application
    platform: macOS
    sources:
      - path: L16Studio/Sources
      - path: L16Studio/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunkencity.L16Studio
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: L16Studio/Info.plist
      properties:
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.sunkencity.L16Studio.lri
            UTTypeDescription: "Light L16 RAW Image"
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - lri
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Light L16 RAW Image"
            LSItemContentTypes:
              - dev.sunkencity.L16Studio.lri
            CFBundleTypeRole: Viewer
    dependencies:
      - package: LRIKit
